<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – Lebenswert Betreuung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #4a8c3f, #2d6a27);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #4a8c3f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      color: white;
      font-weight: 800;
    }
    h1 { font-size: 22px; color: #1a2e1a; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    button {
      background: #4a8c3f;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s;
    }
    button:active { transform: scale(0.97); }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LB</div>
    <div class="icon">📡</div>
    <h1>Keine Verbindung</h1>
    <p>
      Du bist gerade offline. Deine bereits geladenen Daten sind weiterhin verfügbar.
      Sobald du wieder online bist, werden alle Änderungen automatisch synchronisiert.
    </p>
    <button onclick="window.location.reload()">🔄 Erneut versuchen</button>
    <p class="hint">Offline-Einsätze werden beim nächsten Online-Gang automatisch übertragen.</p>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
