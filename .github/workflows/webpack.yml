name: CI

# Das Projekt baut mit Vite und verwaltet Abhängigkeiten mit pnpm.
# Der zuvor hinterlegte Standard-Workflow führte "npm install && npx webpack"
# aus – das Projekt besitzt jedoch weder eine Webpack-Abhängigkeit noch eine
# Webpack-Konfiguration, und "npm install" ignoriert die pnpm-Lockfile samt
# Overrides und Patches. Der Lauf schlug deshalb ausnahmslos fehl.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Vite 7 setzt Node 20.19+ bzw. 22.12+ voraus; Node 18 wird nicht
        # mehr unterstützt und wurde deshalb aus der Matrix entfernt.
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    # pnpm wird über das Feld "packageManager" in package.json gepinnt.
    - name: pnpm einrichten
      uses: pnpm/action-setup@v4

    - name: Node.js ${{ matrix.node-version }} einrichten
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Abhängigkeiten installieren
      run: pnpm install --frozen-lockfile

    - name: TypeScript prüfen
      run: pnpm tsc --noEmit

    - name: Tests ausführen
      run: pnpm test

    - name: Anwendung bauen
      run: pnpm build
